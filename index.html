<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="笔记">
<meta name="theme-color" content="#1e293b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-startup-image" media="(orientation: landscape) and (device-width: 1024px) and (device-height: 768px) and (-webkit-device-pixel-ratio: 2)" href="icons/splash-2048x1536.png">
<link rel="apple-touch-startup-image" media="(orientation: portrait) and (device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2)" href="icons/splash-1536x2048.png">
<link rel="apple-touch-startup-image" media="(orientation: landscape) and (device-width: 1112px) and (device-height: 834px) and (-webkit-device-pixel-ratio: 2)" href="icons/splash-2224x1668.png">
<link rel="apple-touch-startup-image" media="(orientation: portrait) and (device-width: 834px) and (device-height: 1112px) and (-webkit-device-pixel-ratio: 2)" href="icons/splash-1668x2224.png">
<link rel="apple-touch-startup-image" media="(orientation: landscape) and (device-width: 1194px) and (device-height: 834px) and (-webkit-device-pixel-ratio: 2)" href="icons/splash-2388x1668.png">
<link rel="apple-touch-startup-image" media="(orientation: portrait) and (device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2)" href="icons/splash-1668x2388.png">
<link rel="apple-touch-startup-image" media="(orientation: landscape) and (device-width: 1366px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2)" href="icons/splash-2732x2048.png">
<link rel="apple-touch-startup-image" media="(orientation: portrait) and (device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2)" href="icons/splash-2048x2732.png">
<title>笔记 · 精美手写笔记</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" class="app">
  <!-- ============ 顶部工具栏 ============ -->
  <header id="topbar" class="topbar">
    <div class="tb-left">
      <button id="btnLibrary" class="icon-btn" title="资料库" aria-label="资料库">
        <svg viewBox="0 0 24 24" class="ic"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      </button>
      <div class="tb-title">
        <div id="titleNote" class="note-title" contenteditable="false" spellcheck="false">未命名笔记</div>
        <div id="titleMeta" class="note-meta"></div>
      </div>
    </div>

    <div class="tb-tools">
      <div id="toolGroup" class="tool-group">
        <button class="tool-btn" data-tool="ballpen" title="圆珠笔" aria-label="圆珠笔">
          <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="6" r="1.7"/><path d="M12 7.5V19M12 19l-2.6-2.6M12 19l2.6-2.6"/></svg>
          <span class="tool-name">圆珠</span>
        </button>
        <button class="tool-btn active" data-tool="pen" title="钢笔" aria-label="钢笔">
          <svg viewBox="0 0 24 24" class="ic"><path d="M4 20l1.2-4.2L16.5 4.5a2.1 2.1 0 0 1 3 3L8.2 18.8 4 20z"/></svg>
          <span class="tool-name">钢笔</span>
        </button>
        <button class="tool-btn" data-tool="highlighter" title="荧光笔" aria-label="荧光笔">
          <svg viewBox="0 0 24 24" class="ic"><path d="M5 19l6-12 6 12M7 15h10" stroke-width="2.4" fill="none"/></svg>
          <span class="tool-name">荧光</span>
        </button>
        <button class="tool-btn" data-tool="eraser" title="橡皮擦" aria-label="橡皮擦">
          <svg viewBox="0 0 24 24" class="ic"><path d="M14.5 4.5l5 5-9 9-5-5zM10 19h9"/></svg>
          <span class="tool-name">橡皮</span>
        </button>
        <button class="tool-btn" data-tool="lasso" title="套索" aria-label="套索">
          <svg viewBox="0 0 24 24" class="ic"><path d="M5 8a7 7 0 0 1 14 0c0 3.3-2.2 6-5 6.6V18" fill="none"/></svg>
          <span class="tool-name">套索</span>
        </button>
        <button class="tool-btn" data-tool="text" title="文字" aria-label="文字">
          <svg viewBox="0 0 24 24" class="ic"><path d="M5 7V5h14v2M12 5v14m-3 0h6"/></svg>
          <span class="tool-name">文字</span>
        </button>
        <button class="tool-btn" data-tool="shape" title="形状" aria-label="形状">
          <svg viewBox="0 0 24 24" class="ic"><path d="M4 20L20 4M4 20h12M20 4v12" fill="none"/></svg>
          <span class="tool-name">形状</span>
        </button>
      </div>
      <div class="tb-actions">
        <span class="tb-divider"></span>
        <button id="btnColor" class="color-btn" title="颜色与粗细" aria-label="颜色与粗细">
          <span class="color-dot" id="colorDot"></span>
        </button>
        <button id="btnUndo" class="icon-btn" title="撤销" aria-label="撤销" disabled>
          <svg viewBox="0 0 24 24" class="ic"><path d="M9 7L4 12l5 5M4 12h9a6 6 0 0 1 6 6"/></svg>
        </button>
        <button id="btnRedo" class="icon-btn" title="重做" aria-label="重做" disabled>
          <svg viewBox="0 0 24 24" class="ic"><path d="M15 7l5 5-5 5M20 12h-9a6 6 0 0 0-6 6"/></svg>
        </button>
        <span class="tb-divider"></span>
        <button id="btnPages" class="icon-btn" title="页面缩略图" aria-label="页面缩略图">
          <svg viewBox="0 0 24 24" class="ic"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M9 9h6M9 13h6M9 17h4"/></svg>
        </button>
        <button id="btnRec" class="icon-btn" title="录音" aria-label="录音">
          <svg viewBox="0 0 24 24" class="ic"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <div class="tb-menu-wrap">
          <button id="btnMore" class="icon-btn" title="设置" aria-label="设置">
            <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>
          </button>
          <div id="moreMenu" class="menu settings-menu hidden">
            <div class="menu-sec-title">纸张 · 当前笔记</div>
            <div id="paperStyles" class="paper-row"></div>
            <div id="paperColors" class="paper-colors"></div>
            <div class="menu-sec-title">书写工具默认</div>
            <div class="set-row"><span class="set-label">钢笔</span><div id="penColors" class="mini-swatches"></div></div>
            <div class="set-row"><span class="set-label">荧光笔</span><div id="hlColors" class="mini-swatches"></div></div>
            <div class="set-row"><span class="set-label">圆珠笔</span><div id="ballpenColors" class="mini-swatches"></div></div>
            <div class="set-row"><span class="set-label">橡皮擦</span><div id="eraserSizes" class="seg"></div></div>
            <div class="set-row"><span class="set-label">橡皮模式</span><div id="eraserMode" class="seg"></div></div>
            <div class="set-row"><span class="set-label">文字字号</span><div id="textSizeRow" class="seg"></div></div>
            <div class="menu-sec-title">新笔记默认纸张</div>
            <div id="defaultPaperRow" class="set-row"></div>
            <div class="menu-sec-title">手势与界面</div>
            <div class="set-row"><span class="set-label">双指轻点</span><div id="twoFingerRow" class="seg"></div></div>
            <label class="menu-item toggle-row"><span>写到页尾自动翻页</span><input type="checkbox" id="optAutoPage"></label>
            <label class="menu-item toggle-row"><span>手指书写</span><input type="checkbox" id="optFinger"></label>
            <div class="set-row"><span class="set-label">工具条位置</span><div id="toolbarPos" class="seg"></div></div>
            <div class="set-row"><span class="set-label">外观主题</span><div id="themeRow" class="seg"></div></div>
            <div class="menu-sec-title">页面</div>
            <button class="menu-item" data-action="add-page">添加页面</button>
            <button class="menu-item" data-action="duplicate-page">复制当前页</button>
            <button class="menu-item" data-action="copy-page-to">复制当前页到其他笔记…</button>
            <button class="menu-item danger" data-action="delete-page">删除当前页</button>
            <div class="menu-sec-title">导出 / 转移</div>
            <button class="menu-item" data-action="export-note">导出本笔记 (.note)</button>
            <button class="menu-item" data-action="export-pdf">导出为 PDF</button>
            <button class="menu-item" data-action="export-page-png">导出当前页为图片</button>
            <button class="menu-item" data-action="export-library">导出整个资料库</button>
            <button class="menu-item" data-action="import">导入笔记文件…</button>
            <div class="menu-sec-title">账户</div>
            <button class="menu-item" data-action="account">登录 / 注册…</button>
            <button class="menu-item" data-action="logout">退出登录</button>
            <div class="menu-sec-title">关于</div>
            <button class="menu-item" data-action="about">关于「笔记」</button>
          </div>
        </div>
      </div>
    </div>
      <div class="tb-user-wrap">
        <button id="btnUser" class="icon-btn" title="账户" aria-label="账户">
          <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-3.3 3.6-5 8-5s8 1.7 8 5"/></svg>
        </button>
        <div id="userMenu" class="menu hidden">
          <div class="user-info"><span class="user-name" id="userName"></span><span class="user-sub" id="userSub">未登录</span></div>
          <button class="menu-item" data-auth-action="login">登录 / 注册</button>
          <button class="menu-item" data-auth-action="logout">退出登录</button>
        </div>
      </div>
  </header>

  <!-- ============ 主体 ============ -->
  <div id="main" class="main">

    <!-- 资料库侧栏 -->
    <aside id="library" class="library hidden-mobile">
      <div class="lib-head">
        <span class="lib-title">资料库</span>
        <button id="btnNewNote" class="mini-btn primary" title="新建笔记">＋ 笔记</button>
      </div>
      <div id="subjectList" class="subject-list"></div>
      <div id="noteSort" class="seg note-sort"></div>
      <div class="note-search-wrap"><svg viewBox="0 0 24 24" class="ic"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg><input id="noteSearch" type="search" placeholder="搜索笔记" autocomplete="off"></div>
      <div id="noteList" class="note-list"></div>
      <div class="lib-foot">
        <button id="btnNewSubject" class="mini-btn">＋ 项目</button>
        <button id="btnNewNotebook" class="mini-btn">＋ 笔记本</button>
      </div>
    </aside>

    <!-- 画布区 -->
    <section id="canvas-area" class="canvas-area">
      <div id="paperHolder" class="paper-holder">
        <canvas id="viewCanvas"></canvas>
        <div id="textLayer" class="text-layer"></div>
      </div>
      <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon"><svg viewBox="0 0 24 24" class="ic"><path d="M4 20l1.2-4.2L16.5 4.5a2.1 2.1 0 0 1 3 3L8.2 18.8 4 20z"/></svg></div>
        <div class="empty-title">还没有笔记</div>
        <div class="empty-sub">点「＋ 笔记」新建一篇，或从左侧资料库打开</div>
        <button id="btnEmptyNew" class="mini-btn primary">＋ 新建笔记</button>
      </div>
      <div id="pageNav" class="page-nav">
        <button id="btnPrevPage" class="icon-btn sm" aria-label="上一页"><svg viewBox="0 0 24 24" class="ic"><path d="M15 6l-6 6 6 6"/></svg></button>
        <span id="pageIndicator">1 / 1</span>
        <button id="btnNextPage" class="icon-btn sm" aria-label="下一页"><svg viewBox="0 0 24 24" class="ic"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
    </section>

    <!-- 页面缩略图侧栏 -->
    <aside id="pagesPanel" class="pages-panel hidden-mobile">
      <div class="pages-head">
        <span>页面</span>
        <button id="btnAddPage" class="mini-btn primary" title="添加页面">＋</button>
      </div>
      <div id="pagesList" class="pages-list"></div>
    </aside>
  </div>

  <!-- 颜色/粗细 弹层 -->
  <div id="colorPop" class="pop hidden">
    <div id="colorSwatches" class="swatches"></div>
    <div class="width-row">
      <span class="width-label">粗细</span>
      <input id="widthSlider" type="range" min="1" max="30" step="0.5" value="5">
      <span id="widthValue" class="width-value">5</span>
    </div>
    <div class="shape-row hidden" id="shapeRow">
      <button class="shape-btn active" data-shape="line">直线</button>
      <button class="shape-btn" data-shape="rect">矩形</button>
      <button class="shape-btn" data-shape="ellipse">椭圆</button>
      <button class="shape-btn" data-shape="arrow">箭头</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <input type="file" id="fileInput" accept=".note,.notebook,.json,application/json" hidden>
  <div id="multiBar" class="multi-bar hidden">
    <span id="multiCount" class="multi-count">已选 0</span>
    <button class="mini-btn" id="multiMove">移动…</button>
    <button class="mini-btn danger" id="multiDelete">删除</button>
    <button class="mini-btn" id="multiCancel">取消</button>
  </div>
  <div id="modalRoot"></div>
  <!-- 录音面板 -->
  <div id="recPanel" class="rec-panel hidden">
    <div class="rec-head">
      <span class="rec-title">录音</span>
      <button id="recClose" class="icon-btn sm" aria-label="关闭"><svg viewBox="0 0 24 24" class="ic"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="rec-controls">
      <button id="recToggle" class="rec-btn" aria-label="开始录音">
        <svg viewBox="0 0 24 24" class="ic"><path d="M12 3a4 4 0 0 0-4 4v5a4 4 0 0 0 8 0V7a4 4 0 0 0-4-4z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <div class="rec-timer" id="recTimer">0:00</div>
      <div class="rec-status" id="recStatus">未在录音</div>
    </div>
    <div class="rec-list" id="recList"></div>
    <p class="rec-tip">录音保存在本机（导出 .note/.PDF 不包含音频）。</p>
  </div>
  <div id="authModal" class="modal-mask hidden">
    <div class="modal auth-modal">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">登录</button>
        <button class="auth-tab" data-tab="register">注册新账号</button>
      </div>
      <div class="auth-body">
        <div id="authError" class="auth-error hidden"></div>
        <input type="text" id="authUsername" placeholder="用户名（2-20 位，可中文）" autocomplete="username" autocapitalize="none">
        <input type="password" id="authPassword" placeholder="密码（至少 6 位）" autocomplete="current-password">
        <button id="authSubmit" class="m-btn primary auth-submit">登录</button>
        <p class="auth-tip">登录后笔记将按账号分别保存到服务器，可在多台设备间同步。</p>
      </div>
    </div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
